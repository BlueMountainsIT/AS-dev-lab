name: Deploy to Vercel

# When 1Password Credential Broker is available, replace the env block with
# the load-secrets-action step using OP_WORKLOAD_ID, OP_ENVIRONMENT_ID,
# and OP_INTEGRATION_KEY.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
      AUTH0_BASE_URL: ${{ secrets.AUTH0_BASE_URL }}
      AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Sync app secrets to Vercel
        run: |
          sync_env() {
            printf '%s' "$2" | vercel env add "$1" production \
              --token="$VERCEL_TOKEN" \
              --force
          }

          sync_env SUPABASE_URL "$SUPABASE_URL"
          sync_env SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          sync_env AUTH0_SECRET "$AUTH0_SECRET"
          sync_env AUTH0_BASE_URL "$AUTH0_BASE_URL"
          sync_env AUTH0_ISSUER_BASE_URL "$AUTH0_ISSUER_BASE_URL"
          sync_env AUTH0_CLIENT_ID "$AUTH0_CLIENT_ID"
          sync_env AUTH0_CLIENT_SECRET "$AUTH0_CLIENT_SECRET"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
