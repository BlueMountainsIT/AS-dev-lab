name: Deploy to Vercel

# Deploy credentials are loaded at runtime from a 1Password Environment via
# Credential Broker (Workload Identity). GitHub stores only OP_INTEGRATION_KEY
# (org secret) plus OP_WORKLOAD_ID / OP_ENVIRONMENT_ID (vars) — not app secrets.
# See docs/deploy-1password-github.md.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Verify required secrets
        run: |
          required=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            SUPABASE_URL
            SUPABASE_ANON_KEY
            AUTH0_SECRET
            AUTH0_BASE_URL
            AUTH0_ISSUER_BASE_URL
            AUTH0_CLIENT_ID
            AUTH0_CLIENT_SECRET
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Deploy aborted: missing required variable(s) in shell env after 1Password load: ${missing[*]}"
            echo "Configure the 1Password Environment (same names as .env.example) and connect BlueMountainsIT GitHub org via Credential Broker."
            echo "In GitHub, set only OP_INTEGRATION_KEY (organization secret) and OP_WORKLOAD_ID / OP_ENVIRONMENT_ID (repository or org variables) — NOT plaintext app secrets."
            echo "See docs/deploy-1password-github.md and https://www.1password.dev/brokered-access/github-actions"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
