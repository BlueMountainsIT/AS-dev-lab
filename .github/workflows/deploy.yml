name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v5beta
        with:
          export-env: true
        env:
          OP_WORKLOAD_ID: "GN3LIR3QOVDKBJ7MSCGABJWW4E"
          OP_ENVIRONMENT_ID: "2rtmglocixxqnxepxw4tbauxx4"
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # 1Password is the source of truth; Vercel needs these at serverless runtime.
      - name: Sync secrets from 1Password to Vercel
        run: |
          sync_env() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Missing $name — check your 1Password Environment."
              exit 1
            fi
            printf '%s' "$value" | vercel env add "$name" production --force --sensitive --token="$VERCEL_TOKEN"
          }

          sync_env SUPABASE_URL "$SUPABASE_URL"
          sync_env SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          sync_env AUTH0_SECRET "$AUTH0_SECRET"
          sync_env AUTH0_BASE_URL "$AUTH0_BASE_URL"
          sync_env AUTH0_ISSUER_BASE_URL "$AUTH0_ISSUER_BASE_URL"
          sync_env AUTH0_CLIENT_ID "$AUTH0_CLIENT_ID"
          sync_env AUTH0_CLIENT_SECRET "$AUTH0_CLIENT_SECRET"

      - name: Refresh Vercel env for build
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
